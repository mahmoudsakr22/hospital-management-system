  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyForDemo",
      authDomain: "smart-hospital-demo.firebaseapp.com",
      databaseURL: "https://smart-hospital-demo-default-rtdb.firebaseio.com",
      projectId: "smart-hospital-demo",
      storageBucket: "smart-hospital-demo.appspot.com",
      messagingSenderId: "123456789012",
      appId: "1:123456789012:web:abcdef1234567890"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Global Variables
    let currentUser = null;
    let patients = [];
    let doctors = [];
    let appointments = [];
    let invoices = [];
    let beds = [];
    let waitingList = [];
    let auditTrail = [];

    // Utility Functions
    function formatCurrency(amount) {
      return new Intl.NumberFormat('ar-EG', {
        style: 'currency',
        currency: 'EGP'
      }).format(amount);
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString('ar-EG', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    }

    function formatTime(timeString) {
      const [hours, minutes] = timeString.split(':');
      const hour = parseInt(hours);
      const period = hour >= 12 ? 'م' : 'ص';
      const displayHour = hour > 12 ? hour - 12 : hour;
      return `${displayHour}:${minutes} ${period}`;
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `
        <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
        <span>${message}</span>
      `;
      
      const container = document.getElementById('toastContainer');
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.classList.add('show');
      }, 100);
      
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function showLoading() {
      document.getElementById('loadingOverlay').style.display = 'flex';
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').style.display = 'none';
    }

    function openModal(modalId) {
      document.getElementById(modalId).style.display = 'flex';
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }

    function addAuditLog(action, details, userId) {
      const log = {
        id: generateId(),
        action: action,
        details: details,
        userId: userId || currentUser?.id || 'system',
        timestamp: new Date().toISOString()
      };
      
      database.ref('audit').push(log);
    }

    // Tab Navigation
    function switchTab(tabName) {
      // Hide all tabs
      document.querySelectorAll('.tab-content').forEach(tab => {
        tab.classList.remove('active');
      });
      
      // Remove active class from all nav items
      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('active');
      });
      
      // Show selected tab
      document.getElementById(tabName).classList.add('active');
      
      // Add active class to selected nav item
      document.querySelector(`[onclick="switchTab('${tabName}')"]`).classList.add('active');
    }

    // Patient Management
    function registerPatient() {
      const patient = {
        id: generateId(),
        name: document.getElementById('patientName').value,
        nationalId: document.getElementById('nationalId').value,
        phone: document.getElementById('patientPhone').value,
        age: document.getElementById('patientAge').value,
        gender: document.getElementById('patientGender').value,
        bloodType: document.getElementById('bloodType').value,
        department: document.getElementById('department').value,
        doctor: document.getElementById('doctor').value,
        emergencyContact: document.getElementById('emergencyContact').value,
        insurance: document.getElementById('insurance').value,
        notes: document.getElementById('patientNotes').value,
        status: 'active',
        registrationDate: new Date().toISOString(),
        registeredBy: currentUser?.id || 'reception'
      };

      showLoading();
      database.ref('patients').child(patient.id).set(patient)
        .then(() => {
          showToast('تم تسجيل المريض بنجاح');
          document.getElementById('patientForm').reset();
          addAuditLog('تسجيل مريض جديد', `المريض: ${patient.name}`, currentUser?.id);
        })
        .catch(error => {
          showToast('حدث خطأ أثناء التسجيل', 'error');
          console.error(error);
        })
        .finally(() => {
          hideLoading();
        });
    }

    function loadPatients() {
      showLoading();
      database.ref('patients').once('value')
        .then(snapshot => {
          patients = [];
          snapshot.forEach(childSnapshot => {
            patients.push({
              id: childSnapshot.key,
              ...childSnapshot.val()
            });
          });
          renderPatients();
        })
        .catch(error => {
          showToast('حدث خطأ أثناء تحميل المرضى', 'error');
          console.error(error);
        })
        .finally(() => {
          hideLoading();
        });
    }

    function renderPatients() {
      const tbody = document.getElementById('patientsList');
      if (!tbody) return;
      
      tbody.innerHTML = '';
      
      patients.forEach(patient => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${patient.name}</td>
          <td>${patient.nationalId}</td>
          <td>${patient.phone}</td>
          <td>${patient.age}</td>
          <td>${patient.gender === 'male' ? 'ذكر' : 'أنثى'}</td>
          <td>${patient.bloodType}</td>
          <td>${getDepartmentName(patient.department)}</td>
          <td>
            <span class="status-badge status-${patient.status}">
              ${patient.status === 'active' ? 'نشط' : patient.status === 'discharged' ? 'مخرج' : 'تحت الملاحظة'}
            </span>
          </td>
          <td>
            <button class="btn btn-sm btn-primary" onclick="viewPatient('${patient.id}')">
              <i class="fas fa-eye"></i>
            </button>
            <button class="btn btn-sm btn-warning" onclick="editPatient('${patient.id}')">
              <i class="fas fa-edit"></i>
            </button>
            <button class="btn btn-sm btn-danger" onclick="dischargePatient('${patient.id}')">
              <i class="fas fa-sign-out-alt"></i>
            </button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function getDepartmentName(deptId) {
      const departments = {
        'emergency': 'الطوارئ',
        'icu': 'العناية المركزة',
        'surgery': 'الجراحة',
        'pediatrics': 'الأطفال',
        'cardiology': 'القلب',
        'neurology': 'الأعصاب',
        'orthopedics': 'العظام',
        'radiology': 'الأشعة'
      };
      return departments[deptId] || deptId;
    }

    function viewPatient(patientId) {
      const patient = patients.find(p => p.id === patientId);
      if (!patient) return;
      
      // Show patient details modal
      openModal('patientDetailsModal');
      // Populate modal with patient details
    }

    function editPatient(patientId) {
      const patient = patients.find(p => p.id === patientId);
      if (!patient) return;
      
      // Populate form with patient data
      document.getElementById('patientName').value = patient.name;
      document.getElementById('nationalId').value = patient.nationalId;
      // ... other fields
      
      // Change form submit handler to update instead of create
      document.getElementById('patientForm').onsubmit = function(e) {
        e.preventDefault();
        updatePatient(patientId);
      };
    }

    function updatePatient(patientId) {
      const updatedPatient = {
        name: document.getElementById('patientName').value,
        nationalId: document.getElementById('nationalId').value,
        phone: document.getElementById('patientPhone').value,
        age: document.getElementById('patientAge').value,
        gender: document.getElementById('patientGender').value,
        bloodType: document.getElementById('bloodType').value,
        department: document.getElementById('department').value,
        doctor: document.getElementById('doctor').value,
        emergencyContact: document.getElementById('emergencyContact').value,
        insurance: document.getElementById('insurance').value,
        notes: document.getElementById('patientNotes').value
      };

      showLoading();
      database.ref('patients').child(patientId).update(updatedPatient)
        .then(() => {
          showToast('تم تحديث بيانات المريض بنجاح');
          document.getElementById('patientForm').reset();
          addAuditLog('تحديث بيانات مريض', `المريض: ${updatedPatient.name}`, currentUser?.id);
        })
        .catch(error => {
          showToast('حدث خطأ أثناء التحديث', 'error');
          console.error(error);
        })
        .finally(() => {
          hideLoading();
        });
    }

    function dischargePatient(patientId) {
      if (!confirm('هل أنت متأكد من تسجيل خروج المريض؟')) return;
      
      showLoading();
      database.ref('patients').child(patientId).update({
        status: 'discharged',
        dischargeDate: new Date().toISOString()
      })
      .then(() => {
        showToast('تم تسجيل خروج المريض بنجاح');
        addAuditLog('تسجيل خروج مريض', `معرف المريض: ${patientId}`, currentUser?.id);
      })
      .catch(error => {
        showToast('حدث خطأ أثناء تسجيل الخروج', 'error');
        console.error(error);
      })
      .finally(() => {
        hideLoading();
      });
    }

    // Doctor Management
    function loadDoctors() {
      showLoading();
      database.ref('doctors').once('value')
        .then(snapshot => {
          doctors = [];
          snapshot.forEach(childSnapshot => {
            doctors.push({
              id: childSnapshot.key,
              ...childSnapshot.val()
            });
          });
          renderDoctors();
          populateDoctorSelects();
        })
        .catch(error => {
          showToast('حدث خطأ أثناء تحميل الأطباء', 'error');
          console.error(error);
        })
        .finally(() => {
          hideLoading();
        });
    }

    function renderDoctors() {
      const tbody = document.getElementById('doctorsList');
      if (!tbody) return;
      
      tbody.innerHTML = '';
      
      doctors.forEach(doctor => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${doctor.name}</td>
          <td>${doctor.specialization}</td>
          <td>${getDepartmentName(doctor.department)}</td>
          <td>${formatTime(doctor.workFrom)} - ${formatTime(doctor.workTo)}</td>
          <td>
            <span class="status-badge status-${doctor.available ? 'available' : 'busy'}">
              ${doctor.available ? 'متاح' : 'مشغول'}
            </span>
          </td>
          <td>
            <button class="btn btn-sm btn-primary" onclick="viewDoctor('${doctor.id}')">
              <i class="fas fa-eye"></i>
            </button>
            <button class="btn btn-sm btn-warning" onclick="editDoctor('${doctor.id}')">
              <i class="fas fa-edit"></i>
            </button>
            <button class="btn btn-sm btn-${doctor.available ? 'danger' : 'success'}" 
                    onclick="toggleDoctorAvailability('${doctor.id}')">
              <i class="fas fa-${doctor.available ? 'pause' : 'play'}"></i>
            </button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function populateDoctorSelects() {
      const selects = document.querySelectorAll('select[id="doctor"]');
      selects.forEach(select => {
        select.innerHTML = '<option value="">اختر الطبيب</option>';
        doctors.filter(d => d.available).forEach(doctor => {
          const option = document.createElement('option');
          option.value = doctor.id;
          option.textContent = `${doctor.name} - ${doctor.specialization}`;
          select.appendChild(option);
        });
      });
    }

    function toggleDoctorAvailability(doctorId) {
      const doctor = doctors.find(d => d.id === doctorId);
      if (!doctor) return;
      
      showLoading();
      database.ref('doctors').child(doctorId).update({
        available: !doctor.available
      })
      .then(() => {
        showToast(`تم ${doctor.available ? 'إيقاف' : 'تفعيل'} الطبيب بنجاح`);
        addAuditLog('تغيير توفر طبيب', `الطبيب: ${doctor.name}`, currentUser?.id);
      })
      .catch(error => {
        showToast('حدث خطأ', 'error');
        console.error(error);
      })
      .finally(() => {
        hideLoading();
      });
    }

    // Appointment Management
    function scheduleAppointment() {
      const appointment = {
        id: generateId(),
        patientId: document.getElementById('appointmentPatient').value,
        doctorId: document.getElementById('appointmentDoctor').value,
        date: document.getElementById('appointmentDate').value,
        time: document.getElementById('appointmentTime').value,
        type: document.getElementById('appointmentType').value,
        notes: document.getElementById('appointmentNotes').value,
        status: 'scheduled',
        createdAt: new Date().toISOString(),
        createdBy: currentUser?.id || 'reception'
      };

      showLoading();
      database.ref('appointments').child(appointment.id).set(appointment)
        .then(() => {
          showToast('تم حجز الموعد بنجاح');
          document.getElementById('appointmentForm').reset();
          addAuditLog('حجز موعد جديد', `الموعد: ${appointment.date} ${appointment.time}`, currentUser?.id);
        })
        .catch(error => {
          showToast('حدث خطأ أثناء حجز الموعد', 'error');
          console.error(error);
        })
        .finally(() => {
          hideLoading();
        });
    }

    function loadAppointments() {
      showLoading();
      database.ref('appointments').once('value')
        .then(snapshot => {
          appointments = [];
          snapshot.forEach(childSnapshot => {
            appointments.push({
              id: childSnapshot.key,
              ...childSnapshot.val()
            });
          });
          renderAppointments();
        })
        .catch(error => {
          showToast('حدث خطأ أثناء تحميل المواعيد', 'error');
          console.error(error);
        })
        .finally(() => {
          hideLoading();
        });
    }

    function renderAppointments() {
      const tbody = document.getElementById('appointmentsList');
      if (!tbody) return;
      
      tbody.innerHTML = '';
      
      appointments.sort((a, b) => new Date(a.date + ' ' + a.time) - new Date(b.date + ' ' + b.time))
        .forEach(appointment => {
          const patient = patients.find(p => p.id === appointment.patientId);
          const doctor = doctors.find(d => d.id === appointment.doctorId);
          
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${formatDate(appointment.date)}</td>
            <td>${formatTime(appointment.time)}</td>
            <td>${patient ? patient.name : 'N/A'}</td>
            <td>${doctor ? doctor.name : 'N/A'}</td>
            <td>${getAppointmentTypeName(appointment.type)}</td>
            <td>
              <span class="status-badge status-${appointment.status}">
                ${getAppointmentStatusName(appointment.status)}
              </span>
            </td>
            <td>
              <button class="btn btn-sm btn-primary" onclick="viewAppointment('${appointment.id}')">
                <i class="fas fa-eye"></i>
              </button>
              <button class="btn btn-sm btn-success" onclick="confirmAppointment('${appointment.id}')">
                <i class="fas fa-check"></i>
              </button>
              <button class="btn btn-sm btn-danger" onclick="cancelAppointment('${appointment.id}')">
                <i class="fas fa-times"></i>
              </button>
            </td>
          `;
          tbody.appendChild(row);
        });
    }

    function getAppointmentTypeName(type) {
      const types = {
        'consultation': 'استشارة',
        'followup': 'متابعة',
        'emergency': 'طوارئ',
        'surgery': 'جراحة',
        'checkup': 'فحص دوري'
      };
      return types[type] || type;
    }

    function getAppointmentStatusName(status) {
      const statuses = {
        'scheduled': 'مجدول',
        'confirmed': 'مؤكد',
        'completed': 'مكتمل',
        'cancelled': 'ملغي',
        'no-show': 'لم يحضر'
      };
      return statuses[status] || status;
    }

    function confirmAppointment(appointmentId) {
      showLoading();
      database.ref('appointments').child(appointmentId).update({
        status: 'confirmed',
        confirmedAt: new Date().toISOString()
      })
      .then(() => {
        showToast('تم تأكيد الموعد بنجاح');
        addAuditLog('تأكيد موعد', `معرف الموعد: ${appointmentId}`, currentUser?.id);
      })
      .catch(error => {
        showToast('حدث خطأ', 'error');
        console.error(error);
      })
      .finally(() => {
        hideLoading();
      });
    }

    function cancelAppointment(appointmentId) {
      if (!confirm('هل أنت متأكد من إلغاء الموعد؟')) return;
      
      showLoading();
      database.ref('appointments').child(appointmentId).update({
        status: 'cancelled',
        cancelledAt: new Date().toISOString()
      })
      .then(() => {
        showToast('تم إلغاء الموعد بنجاح');
        addAuditLog('إلغاء موعد', `معرف الموعد: ${appointmentId}`, currentUser?.id);
      })
      .catch(error => {
        showToast('حدث خطأ', 'error');
        console.error(error);
      })
      .finally(() => {
        hideLoading();
      });
    }

    // Billing Management
    function createInvoice() {
      const invoice = {
        id: generateId(),
        patientId: document.getElementById('invoicePatient').value,
        services: getSelectedServices(),
        subtotal: calculateSubtotal(),
        discount: parseFloat(document.getElementById('discount').value) || 0,
        tax: calculateTax(),
        total: calculateTotal(),
        paymentMethod: document.getElementById('paymentMethod').value,
        status: 'pending',
        createdAt: new Date().toISOString(),
        createdBy: currentUser?.id || 'reception'
      };

      showLoading();
      database.ref('invoices').child(invoice.id).set(invoice)
        .then(() => {
          showToast('تم إنشاء الفاتورة بنجاح');
          document.getElementById('invoiceForm').reset();
          addAuditLog('إنشاء فاتورة', `المبلغ: ${formatCurrency(invoice.total)}`, currentUser?.id);
        })
        .catch(error => {
          showToast('حدث خطأ أثناء إنشاء الفاتورة', 'error');
          console.error(error);
        })
        .finally(() => {
          hideLoading();
        });
    }

    function loadInvoices() {
      showLoading();
      database.ref('invoices').once('value')
        .then(snapshot => {
          invoices = [];
          snapshot.forEach(childSnapshot => {
            invoices.push({
              id: childSnapshot.key,
              ...childSnapshot.val()
            });
          });
          renderInvoices();
        })
        .catch(error => {
          showToast('حدث خطأ أثناء تحميل الفواتير', 'error');
          console.error(error);
        })
        .finally(() => {
          hideLoading();
        });
    }

    function renderInvoices() {
      const tbody = document.getElementById('invoicesList');
      if (!tbody) return;
      
      tbody.innerHTML = '';
      
      invoices.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
        .forEach(invoice => {
          const patient = patients.find(p => p.id === invoice.patientId);
          
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>#${invoice.id.substr(-6)}</td>
            <td>${patient ? patient.name : 'N/A'}</td>
            <td>${formatDate(invoice.createdAt)}</td>
            <td>${formatCurrency(invoice.total)}</td>
            <td>
              <span class="status-badge status-${invoice.status}">
                ${invoice.status === 'paid' ? 'مدفوعة' : invoice.status === 'pending' ? 'معلقة' : 'ملغاة'}
              </span>
            </td>
            <td>
              <button class="btn btn-sm btn-primary" onclick="viewInvoice('${invoice.id}')">
                <i class="fas fa-eye"></i>
              </button>
              <button class="btn btn-sm btn-success" onclick="payInvoice('${invoice.id}')">
                <i class="fas fa-money-bill"></i>
              </button>
              <button class="btn btn-sm btn-info" onclick="printInvoice('${invoice.id}')">
                <i class="fas fa-print"></i>
              </button>
            </td>
          `;
          tbody.appendChild(row);
        });
    }

    function payInvoice(invoiceId) {
      const invoice = invoices.find(i => i.id === invoiceId);
      if (!invoice) return;
      
      showLoading();
      database.ref('invoices').child(invoiceId).update({
        status: 'paid',
        paidAt: new Date().toISOString()
      })
      .then(() => {
        showToast('تم سداد الفاتورة بنجاح');
        addAuditLog('سداد فاتورة', `المبلغ: ${formatCurrency(invoice.total)}`, currentUser?.id);
      })
      .catch(error => {
        showToast('حدث خطأ أثناء السداد', 'error');
        console.error(error);
      })
      .finally(() => {
        hideLoading();
      });
    }

    function printInvoice(invoiceId) {
      const invoice = invoices.find(i => i.id === invoiceId);
      if (!invoice) return;
      
      // Create print window
      const printWindow = window.open('', '_blank');
      const patient = patients.find(p => p.id === invoice.patientId);
      
      printWindow.document.write(`
        <html dir="rtl">
        <head>
          <title>فاتورة - #${invoice.id.substr(-6)}</title>
          <style>
            body { font-family: Arial, sans-serif; padding: 20px; }
            .header { text-align: center; margin-bottom: 30px; }
            .invoice-details { margin-bottom: 20px; }
            table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
            th, td { border: 1px solid #ddd; padding: 8px; text-align: right; }
            th { background-color: #f5f5f5; }
            .total { font-weight: bold; font-size: 18px; }
            .footer { margin-top: 30px; text-align: center; font-size: 12px; color: #666; }
          </style>
        </head>
        <body>
          <div class="header">
            <h1>مستشفى الحياة الذكية</h1>
            <h2>فاتورة</h2>
            <p>#${invoice.id.substr(-6)}</p>
          </div>
          
          <div class="invoice-details">
            <p><strong>المريض:</strong> ${patient ? patient.name : 'N/A'}</p>
            <p><strong>التاريخ:</strong> ${formatDate(invoice.createdAt)}</p>
            <p><strong>طريقة الدفع:</strong> ${invoice.paymentMethod}</p>
          </div>
          
          <table>
            <thead>
              <tr>
                <th>الخدمة</th>
                <th>السعر</th>
              </tr>
            </thead>
            <tbody>
              ${invoice.services.map(service => `
                <tr>
                  <td>${service.name}</td>
                  <td>${formatCurrency(service.price)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
          
          <div class="total">
            <p>الإجمالي: ${formatCurrency(invoice.total)}</p>
          </div>
          
          <div class="footer">
            <p>شكراً لثقتكم بنا</p>
            <p>مستشفى الحياة الذكية - جميع الحقوق محفوظة</p>
          </div>
        </body>
        </html>
      `);
      
      printWindow.document.close();
      printWindow.print();
    }

    // Bed Management
    function initializeBeds() {
      const bedData = [];
      const departments = ['emergency', 'icu', 'surgery', 'pediatrics', 'cardiology'];
      const bedsPerDept = 20;
      
      departments.forEach(dept => {
        for (let i = 1; i <= bedsPerDept; i++) {
          bedData.push({
            id: `${dept}-${i}`,
            department: dept,
            number: i,
            status: 'available',
            patientId: null,
            assignedAt: null
          });
        }
      });
      
      showLoading();
      database.ref('beds').set(bedData)
        .then(() => {
          showToast('تم تهيئة الأسرة بنجاح');
          loadBeds();
        })
        .catch(error => {
          showToast('حدث خطأ أثناء تهيئة الأسرة', 'error');
          console.error(error);
        })
        .finally(() => {
          hideLoading();
        });
    }

    function loadBeds() {
      showLoading();
      database.ref('beds').once('value')
        .then(snapshot => {
          beds = [];
          snapshot.forEach(childSnapshot => {
            beds.push({
              id: childSnapshot.key,
              ...childSnapshot.val()
            });
          });
          renderBeds();
        })
        .catch(error => {
          showToast('حدث خطأ أثناء تحميل الأسرة', 'error');
          console.error(error);
        })
        .finally(() => {
          hideLoading();
        });
    }

    function renderBeds() {
      const grid = document.getElementById('bedGrid');
      if (!grid) return;
      
      grid.innerHTML = '';
      
      const departments = [...new Set(beds.map(bed => bed.department))];
      
      departments.forEach(dept => {
        const deptBeds = beds.filter(bed => bed.department === dept);
        const deptDiv = document.createElement('div');
        deptDiv.className = 'bed-department';
        deptDiv.innerHTML = `
          <h4>${getDepartmentName(dept)}</h4>
          <div class="beds-container">
            ${deptBeds.map(bed => `
              <div class="bed bed-${bed.status}" onclick="assignBed('${bed.id}')">
                <div class="bed-number">${bed.number}</div>
                <div class="bed-status">
                  <i class="fas fa-${bed.status === 'available' ? 'bed' : bed.status === 'occupied' ? 'user' : 'tools'}"></i>
                </div>
              </div>
            `).join('')}
          </div>
        `;
        grid.appendChild(deptDiv);
      });
    }

    function assignBed(bedId) {
      const bed = beds.find(b => b.id === bedId);
      if (!bed) return;
      
      if (bed.status === 'occupied') {
        // Show patient info
        const patient = patients.find(p => p.id === bed.patientId);
        if (patient) {
          showToast(`السرير محجوز للمريض: ${patient.name}`, 'info');
        }
        return;
      }
      
      // Show available patients to assign
      const availablePatients = patients.filter(p => p.status === 'active' && !beds.find(b => b.patientId === p.id));
      if (availablePatients.length === 0) {
        showToast('لا يوجد مرضى متاحين للحجز', 'warning');
        return;
      }
      
      // Create selection modal
      const modal = document.createElement('div');
      modal.className = 'modal';
      modal.innerHTML = `
        <div class="modal-content">
          <div class="modal-header">
            <h3>اختر مريض للسرير ${bed.number}</h3>
            <button class="close-btn" onclick="this.closest('.modal').remove()">&times;</button>
          </div>
          <div class="modal-body">
            <div class="patient-list">
              ${availablePatients.map(patient => `
                <div class="patient-item" onclick="confirmBedAssignment('${bedId}', '${patient.id}')">
                  <h4>${patient.name}</h4>
                  <p>${patient.age} سنة - ${patient.gender === 'male' ? 'ذكر' : 'أنثى'}</p>
                  <p>${getDepartmentName(patient.department)}</p>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    function confirmBedAssignment(bedId, patientId) {
      showLoading();
      database.ref('beds').child(bedId).update({
        status: 'occupied',
        patientId: patientId,
        assignedAt: new Date().toISOString()
      })
      .then(() => {
        showToast('تم حجز السرير بنجاح');
        document.querySelector('.modal').remove();
        addAuditLog('حجز سرير', `السرير: ${bedId} - المريض: ${patientId}`, currentUser?.id);
      })
      .catch(error => {
        showToast('حدث خطأ أثناء حجز السرير', 'error');
        console.error(error);
      })
      .finally(() => {
        hideLoading();
      });
    }

    // Waiting List Management
    function addToWaitingList() {
      const patientId = document.getElementById('waitingPatient').value;
      const priority = document.getElementById('waitingPriority').value;
      const notes = document.getElementById('waitingNotes').value;
      
      const waitingItem = {
        id: generateId(),
        patientId: patientId,
        priority: priority,
        notes: notes,
        status: 'waiting',
        addedAt: new Date().toISOString(),
        addedBy: currentUser?.id || 'reception'
      };
      
      showLoading();
      database.ref('waiting').child(waitingItem.id).set(waitingItem)
        .then(() => {
          showToast('تمت إضافة المريض لقائمة الانتظار');
          document.getElementById('waitingForm').reset();
          addAuditLog('إضافة لقائمة الانتظار', `المريض: ${patientId}`, currentUser?.id);
        })
        .catch(error => {
          showToast('حدث خطأ', 'error');
          console.error(error);
        })
        .finally(() => {
          hideLoading();
        });
    }

    function loadWaitingList() {
      showLoading();
      database.ref('waiting').once('value')
        .then(snapshot => {
          waitingList = [];
          snapshot.forEach(childSnapshot => {
            waitingList.push({
              id: childSnapshot.key,
              ...childSnapshot.val()
            });
          });
          renderWaitingList();
        })
        .catch(error => {
          showToast('حدث خطأ', 'error');
          console.error(error);
        })
        .finally(() => {
          hideLoading();
        });
    }

    function renderWaitingList() {
      const tbody = document.getElementById('waitingList');
      if (!tbody) return;
      
      tbody.innerHTML = '';
      
      waitingList.sort((a, b) => {
        const priorityOrder = { 'critical': 0, 'high': 1, 'medium': 2, 'low': 3 };
        return priorityOrder[a.priority] - priorityOrder[b.priority];
      }).forEach(item => {
        const patient = patients.find(p => p.id === item.patientId);
        
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${patient ? patient.name : 'N/A'}</td>
          <td>
            <span class="priority-badge priority-${item.priority}">
              ${getPriorityName(item.priority)}
            </span>
          </td>
          <td>${formatDate(item.addedAt)}</td>
          <td>${formatTime(item.addedAt)}</td>
          <td>${item.notes || '-'}</td>
          <td>
            <button class="btn btn-sm btn-success" onclick="callFromWaiting('${item.id}')">
              <i class="fas fa-bell"></i>
            </button>
            <button class="btn btn-sm btn-danger" onclick="removeFromWaiting('${item.id}')">
              <i class="fas fa-times"></i>
            </button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function getPriorityName(priority) {
      const priorities = {
        'critical': 'حرج',
        'high': 'عالي',
        'medium': 'متوسط',
        'low': 'منخفض'
      };
      return priorities[priority] || priority;
    }

    function callFromWaiting(itemId) {
      const item = waitingList.find(i => i.id === itemId);
      if (!item) return;
      
      showLoading();
      database.ref('waiting').child(itemId).update({
        status: 'called',
        calledAt: new Date().toISOString()
      })
      .then(() => {
        showToast('تم استدعاء المريض');
        addAuditLog('استدعاء من قائمة الانتظار', `المريض: ${item.patientId}`, currentUser?.id);
      })
      .catch(error => {
        showToast('حدث خطأ', 'error');
        console.error(error);
      })
      .finally(() => {
        hideLoading();
      });
    }

    function removeFromWaiting(itemId) {
      if (!confirm('هل أنت متأكد من إزالة المريض من قائمة الانتظار؟')) return;
      
      showLoading();
      database.ref('waiting').child(itemId).remove()
        .then(() => {
          showToast('تمت إزالة المريض من قائمة الانتظار');
          addAuditLog('إزالة من قائمة الانتظار', `المعرف: ${itemId}`, currentUser?.id);
        })
        .catch(error => {
          showToast('حدث خطأ', 'error');
          console.error(error);
        })
        .finally(() => {
          hideLoading();
        });
    }

    // Dashboard Charts
    function initializeCharts() {
      // Patients by Department Chart
      const deptCtx = document.getElementById('deptChart').getContext('2d');
      new Chart(deptCtx, {
        type: 'doughnut',
        data: {
          labels: ['الطوارئ', 'العناية المركزة', 'الجراحة', 'الأطفال', 'القلب'],
          datasets: [{
            data: [0, 0, 0, 0, 0],
            backgroundColor: [
              '#FF6384',
              '#36A2EB',
              '#FFCE56',
              '#4BC0C0',
              '#9966FF'
            ]
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false
        }
      });

      // Daily Admissions Chart
      const dailyCtx = document.getElementById('dailyChart').getContext('2d');
      new Chart(dailyCtx, {
        type: 'line',
        data: {
          labels: ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'],
          datasets: [{
            label: 'المرضى',
            data: [0, 0, 0, 0, 0, 0, 0],
            borderColor: '#36A2EB',
            backgroundColor: 'rgba(54, 162, 235, 0.1)',
            tension: 0.4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false
        }
      });

      // Revenue Chart
      const revenueCtx = document.getElementById('revenueChart').getContext('2d');
      new Chart(revenueCtx, {
        type: 'bar',
        data: {
          labels: ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو'],
          datasets: [{
            label: 'الإيرادات',
            data: [0, 0, 0, 0, 0, 0],
            backgroundColor: '#4BC0C0'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false
        }
      });
    }

    function updateDashboard() {
      // Update statistics
      document.getElementById('totalPatients').textContent = patients.length;
      document.getElementById('activePatients').textContent = patients.filter(p => p.status === 'active').length;
      document.getElementById('todayAppointments').textContent = appointments.filter(a => 
        a.date === new Date().toISOString().split('T')[0] && a.status === 'scheduled'
      ).length;
      document.getElementById('availableBeds').textContent = beds.filter(b => b.status === 'available').length;
      
      // Update charts
      updateCharts();
    }

    function updateCharts() {
      // Update department chart
      const deptData = {};
      patients.forEach(patient => {
        deptData[patient.department] = (deptData[patient.department] || 0) + 1;
      });
      
      // Update daily admissions chart
      const dailyData = new Array(7).fill(0);
      const today = new Date();
      patients.forEach(patient => {
        const day = new Date(patient.registrationDate).getDay();
        dailyData[day]++;
      });
      
      // Update revenue chart
      const revenueData = new Array(6).fill(0);
      const currentMonth = new Date().getMonth();
      invoices.forEach(invoice => {
        if (invoice.status === 'paid') {
          const month = new Date(invoice.createdAt).getMonth();
          if (month >= currentMonth - 5 && month <= currentMonth) {
            revenueData[month - (currentMonth - 5)] += invoice.total;
          }
        }
      });
    }

    // Search and Filter
    function searchPatients() {
      const searchTerm = document.getElementById('searchPatients').value.toLowerCase();
      const filteredPatients = patients.filter(patient => 
        patient.name.toLowerCase().includes(searchTerm) ||
        patient.nationalId.includes(searchTerm) ||
        patient.phone.includes(searchTerm)
      );
      
      const tbody = document.getElementById('patientsList');
      tbody.innerHTML = '';
      
      filteredPatients.forEach(patient => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${patient.name}</td>
          <td>${patient.nationalId}</td>
          <td>${patient.phone}</td>
          <td>${patient.age}</td>
          <td>${patient.gender === 'male' ? 'ذكر' : 'أنثى'}</td>
          <td>${patient.bloodType}</td>
          <td>${getDepartmentName(patient.department)}</td>
          <td>
            <span class="status-badge status-${patient.status}">
              ${patient.status === 'active' ? 'نشط' : patient.status === 'discharged' ? 'مخرج' : 'تحت الملاحظة'}
            </span>
          </td>
          <td>
            <button class="btn btn-sm btn-primary" onclick="viewPatient('${patient.id}')">
              <i class="fas fa-eye"></i>
            </button>
            <button class="btn btn-sm btn-warning" onclick="editPatient('${patient.id}')">
              <i class="fas fa-edit"></i>
            </button>
            <button class="btn btn-sm btn-danger" onclick="dischargePatient('${patient.id}')">
              <i class="fas fa-sign-out-alt"></i>
            </button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    // Export Functions
    function exportPatients() {
      const data = patients.map(patient => ({
        'الاسم': patient.name,
        'الرقم القومي': patient.nationalId,
        'الهاتف': patient.phone,
        'العمر': patient.age,
        'الجنس': patient.gender === 'male' ? 'ذكر' : 'أنثى',
        'فصيلة الدم': patient.bloodType,
        'القسم': getDepartmentName(patient.department),
        'الحالة': patient.status === 'active' ? 'نشط' : 'مخرج'
      }));
      
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'المرضى');
      XLSX.writeFile(wb, 'patients.xlsx');
    }

    function exportAppointments() {
      const data = appointments.map(appointment => {
        const patient = patients.find(p => p.id === appointment.patientId);
        const doctor = doctors.find(d => d.id === appointment.doctorId);
        return {
          'التاريخ': formatDate(appointment.date),
          'الوقت': formatTime(appointment.time),
          'المريض': patient ? patient.name : 'N/A',
          'الطبيب': doctor ? doctor.name : 'N/A',
          'النوع': getAppointmentTypeName(appointment.type),
          'الحالة': getAppointmentStatusName(appointment.status)
        };
      });
      
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'المواعيد');
      XLSX.writeFile(wb, 'appointments.xlsx');
    }

    // Initialize Application
    function initializeApp() {
      // Check if beds are initialized
      database.ref('beds').once('value')
        .then(snapshot => {
          if (!snapshot.exists()) {
            initializeBeds();
          } else {
            loadBeds();
          }
        });
      
      // Load initial data
      loadPatients();
      loadDoctors();
      loadAppointments();
      loadInvoices();
      loadWaitingList();
      
      // Initialize charts
      initializeCharts();
      
      // Update dashboard
      updateDashboard();
      
      // Set up real-time listeners
      database.ref('patients').on('value', loadPatients);
      database.ref('doctors').on('value', loadDoctors);
      database.ref('appointments').on('value', loadAppointments);
      database.ref('invoices').on('value', loadInvoices);
      database.ref('beds').on('value', loadBeds);
      database.ref('waiting').on('value', loadWaitingList);
      
      // Auto-refresh dashboard every 30 seconds
      setInterval(updateDashboard, 30000);
    }

    // Start the application
    document.addEventListener('DOMContentLoaded', initializeApp);
  </script>
</body>
</html>
